<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos | Full Cars</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="pagina-vehiculos">

    <!-- NAVBAR -->
    <header>
        <nav>
            <a href="index.html">
                <img src="img/logo.jpg" alt="Full Cars">
            </a>

            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="vehiculos.html">Vehículos</a></li>
                <li><a href="financiacion.html">Financiación</a></li>
                <li><a href="turnos.html">Turnos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="nav-sesion"><a href="login.html">Ingresar</a></li>
            </ul>

        </nav>
    </header>


    <main>
        <section class="catalogo">

            <h1>Vehículos disponibles</h1>
            <p>
                Encontrá el vehículo que estás buscando.
            </p>

            <!-- BUSCADOR -->
            <section class="buscador">
                <input type="search" id="busqueda" placeholder="Buscar marca o modelo...">
            </section>


            <!-- FILTROS -->
            <section class="filtros">

                <!-- Las marcas y los años los completa JavaScript con los datos de la base -->
                <select id="marca">
                    <option value="">
                        Todas las marcas
                    </option>
                </select>

                <select id="anio">
                    <option value="">
                        Todos los años
                    </option>
                </select>

                <select id="transmision">

                    <option value="">
                        Todas las transmisiones
                    </option>

                    <option value="Manual">
                        Manual
                    </option>

                    <option value="Automático">
                        Automático
                    </option>

                </select>
            </section>


            <!-- LISTADO -->
            <!-- JavaScript (js/script.js) crea acá una vehiculo-card por cada auto de la base -->
            <section class="vehiculos-container" id="lista-vehiculos"></section>

            <!-- Aviso que JavaScript muestra cuando ningún auto coincide con los filtros -->
            <p class="mensaje" id="sin-resultados" hidden>
                No hay vehículos que coincidan con tu búsqueda.
            </p>
        </section>
    </main>


    <footer>
        <p>2026 Full Cars.</p>
    </footer>

    <script src="js/script.js" defer></script>

    <script src="js/sesion.js" defer></script>

</body>

</html>
