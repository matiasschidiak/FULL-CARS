<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Full Cars</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="pagina-contacto">

    <header>

        <nav>

            <a href="index.html">
                <img src="img/logo.jpg" alt="Full Cars">
            </a>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="vehiculos.html">Vehículos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="financiacion.html">Financiación</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

    </header>
    <main>

        <section class="contacto">

            <h1>Contactanos</h1>

            <p>
                ¿Encontraste un vehículo que te interesa?
                Estamos para ayudarte.
            </p>


            <div class="contacto-container">


                <!-- INFORMACIÓN -->
                <section>

                    <h2>Información</h2>

                    <p>
                        📱 WhatsApp
                    </p>

                    <p>
                        📸 Instagram
                    </p>

                    <p>
                        📍 Ubicación
                    </p>

                    <p>
                        🕐 Horarios de atención
                    </p>

                </section>


                <!-- FORMULARIO -->
                <section>

                    <h2>Enviar consulta</h2>

                    <form>

                        <label for="nombre">
                            Nombre
                        </label>

                        <input type="text" id="nombre" name="nombre" required>


                        <label for="email">
                            Email
                        </label>

                        <input type="email" id="email" name="email" required>


                        <label for="telefono">
                            Teléfono
                        </label>

                        <input type="tel" id="telefono" name="telefono">


                        <label for="mensaje">
                            Mensaje
                        </label>

                        <textarea id="mensaje" name="mensaje" required>
                        </textarea>

                        <button type="submit" class="btn">Enviar consulta</button>

                    </form>
                </section>
            </div>
        </section>
    </main>


    <footer>
        <p>2026 Full Cars.</p>
    </footer>

</body>

</html>
