<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del vehículo | Full Cars</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="pagina-detalles">

    <!-- NAVBAR -->
    <header>

        <nav>
            <a href="index.html">
                <img src="img/logo.jpg" alt="Full Cars">
            </a>

            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="vehiculos.html">Vehículos</a></li>
                <li><a href="financiacion.html">Financiación</a></li>
                <li><a href="turnos.html">Turnos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="nav-sesion"><a href="login.html">Ingresar</a></li>
            </ul>

        </nav>

    </header>
    <main>

        <!-- JavaScript (js/script.js) completa los elementos con id según el ?id= de la URL -->
        <section class="detalle-vehiculo" id="detalle-vehiculo">


            <!-- GALERÍA -->
            <section class="galeria">
                <img id="det-imagen" src="img/autoejemplo.jpg" alt="">

                <div class="miniaturas">
                    <img src="img/autoejemplo.jpg" alt="">
                    <img src="img/autoejemplo.jpg" alt="">
                    <img src="img/autoejemplo.jpg" alt="">

                </div>
            </section>


            <!-- INFORMACIÓN -->
            <section class="informacion-vehiculo">

                <span class="marca" id="det-marca"></span>

                <h1 id="det-modelo">Cargando vehículo…</h1>

                <h2 id="det-precio"></h2>


                <!-- CARACTERÍSTICAS -->
                <div class="caracteristicas">

                    <div>
                        <span>Año</span>
                        <strong id="det-anio">—</strong>
                    </div>

                    <div>
                        <span>Kilometraje</span>
                        <strong id="det-kilometraje">—</strong>
                    </div>

                    <div>
                        <span>Motor</span>
                        <strong id="det-motor">—</strong>
                    </div>

                    <div>
                        <span>Combustible</span>
                        <strong id="det-combustible">—</strong>
                    </div>

                    <div>
                        <span>Transmisión</span>
                        <strong id="det-transmision">—</strong>
                    </div>

                </div>


                <!-- DESCRIPCIÓN -->
                <div class="descripcion">

                    <h2>Descripción</h2>

                    <p id="det-descripcion"></p>

                </div>


                <!-- EQUIPAMIENTO (se oculta si el auto no tiene cargado ninguno) -->
                <div class="equipamiento" id="det-equipamiento-box">

                    <h2>Equipamiento</h2>

                    <ul id="det-equipamiento"></ul>

                </div>


                <!-- CONTACTO -->
                <div class="contactar">

                    <!-- script.js arma el enlace con el número y el nombre del auto -->
                    <a href="#" class="btn" id="det-whatsapp" target="_blank" rel="noopener">Consultar por WhatsApp</a>

                    <!-- script.js le agrega ?vehiculo=ID para que el auto quede elegido -->
                    <a href="turnos.html" class="btn btn-outline" id="det-turno">Sacar turno para verlo</a>

                    <a href="contacto.html" class="btn btn-outline">Contactar con Full Cars</a>

                </div>
            </section>
        </section>
    </main>

    <footer>

        <p>2026 Full Cars.</p>

    </footer>

    <script src="js/script.js" defer></script>

    <script src="js/sesion.js" defer></script>

</body>

</html>
