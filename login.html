<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Full Cars</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <nav>
            <a href="index.html">
                <img src="img/logo.jpg" alt="Full Cars">
            </a>

            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="vehiculos.html">Vehículos</a></li>
                <li><a href="financiacion.html">Financiación</a></li>
                <li><a href="turnos.html">Turnos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="nav-sesion"><a href="login.html">Ingresar</a></li>
            </ul>
        </nav>
    </header>

    <main class="acceso">

        <h1>Iniciar sesión</h1>

        <form id="form-login">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit" class="btn">Ingresar</button>

            <p class="mensaje" id="mensaje"></p>

        </form>

        <p>¿No tenés cuenta? <a href="registro.html">Registrate</a></p>

    </main>

    <footer>
        <p>2026 Full Cars.</p>
    </footer>

    <script src="js/login.js" defer></script>

    <script src="js/sesion.js" defer></script>

</body>

</html>
